name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_TEST_POSTGRES_URL: postgresql://agent:agent@127.0.0.1:5432/agent_test
      AGENT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,production]"
      - name: Run tests
        run: python -m pytest tests -q
      - name: Static analysis
        run: python -m ruff check .
      - name: Validate retrieval provenance
        run: python scripts/validate_retrieval_manifest.py
      - name: Offline retrieval regression
        run: >-
          python scripts/evaluate_retrieval.py
          --golden evals/retrieval_golden.jsonl
          --fixture evals/fixtures/retrieval_rankings_v1.json
          --baseline evals/baselines/retrieval_baseline_v1.json
          --gate
          --gate-strategy hybrid
          --min-recall 0.90
          --min-precision 0.15
          --min-mrr 0.90
          --min-ndcg 0.90
          --report reports/retrieval-offline.json
      - name: Offline generation grounding regression
        run: >-
          python scripts/evaluate_generation.py
          --golden evals/generation_golden.jsonl
          --baseline evals/baselines/generation_baseline_v1.json
          --gate
          --min-pass-rate 1.0
          --min-refusal-accuracy 1.0
          --min-fact-coverage 1.0
          --min-citation-validity 1.0
          --max-forbidden-hit-rate 0.0
          --max-unsupported-claim-rate 0.05
          --report reports/generation-offline.json
      - name: Offline agent regression (62 cases)
        env:
          MODEL_PROVIDER: mock
        run: >-
          python scripts/evaluate_agent.py
          --golden evals/agent_offline_golden.jsonl
          --mode harness
          --offline
          --baseline evals/baselines/agent_baseline_v1.json
          --gate
          --min-pass-rate 0.90
          --min-tool-recall 0.85
          --min-keyword-recall 0.80
          --min-parameter-accuracy 0.90
          --min-citation-validity 0.90
          --min-case-count 60
          --max-p95-latency-ms 2000
          --report reports/agent-offline.json
