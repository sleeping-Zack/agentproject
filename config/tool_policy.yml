version: tool-policy-v1

# Rules are evaluated by descending priority. File order breaks equal-priority
# ties, and the first matching rule wins. No match is always a deny.
default:
  action: deny
  reason_code: default_deny
  reason: no matching tool policy rule

rules:
  - id: support-ticket-create
    priority: 350
    match:
      tenants: ["*"]
      roles: [user, operator, admin]
      scenes: ["*"]
      tools: [create_support_ticket]
      data_scopes: [support_ticket:write]
      risk_levels: [high]
      argument_constraints:
        required: [model, issue_type, description]
        fields:
          issue_type:
            one_of: [repair, maintenance, warranty, other]
    action: allow
    requires_approval: true
    reason_code: support_ticket_requires_approval
    reason: "tool requires approval: create_support_ticket"

  # Demonstrates a real tenant-specific entitlement: tenant-b purchases the
  # knowledge-only tier and cannot use environment/weather tools.
  - id: tenant-b-weather-disabled
    priority: 400
    match:
      tenants: [tenant-b]
      roles: [user]
      scenes: ["*"]
      tools: [get_weather, get_user_location]
      data_scopes: [environment:read, user:read]
      risk_levels: [low]
    action: deny
    reason_code: tenant_feature_not_enabled
    reason: weather tools are not enabled for this tenant

  - id: report-data-admin
    priority: 300
    match:
      tenants: ["*"]
      roles: [admin, operator]
      scenes: [report, monthly_report]
      tools: [fetch_external_data]
      data_scopes: [usage_record:read]
      risk_levels: [medium]
    action: allow
    requires_approval: false
    reason_code: report_data_admin
    reason: allowed

  - id: report-data-self
    priority: 250
    match:
      tenants: ["*"]
      roles: [user]
      scenes: [report, monthly_report]
      tools: [fetch_external_data]
      data_scopes: [usage_record:read]
      risk_levels: [medium]
      argument_constraints:
        required: [user_id, month]
        fields:
          user_id:
            equals_context: data_user_id
          month:
            regex: "^20[0-9]{2}-(0[1-9]|1[0-2])$"
    action: allow
    requires_approval: false
    reason_code: report_data_self
    reason: authenticated user may read their own single-month usage record

  - id: report-data-user-approval
    priority: 200
    match:
      tenants: ["*"]
      roles: [user]
      scenes: [report, monthly_report]
      tools: [fetch_external_data]
      data_scopes: [usage_record:read]
      risk_levels: [medium]
    action: allow
    requires_approval: true
    reason_code: report_data_requires_approval
    reason: "tool requires approval: fetch_external_data"

  - id: standard-tools
    priority: 100
    match:
      tenants: ["*"]
      roles: [user, operator, admin]
      scenes: ["*"]
      tools:
        - rag_summarize
        - get_weather
        - get_user_location
        - get_user_id
        - get_current_month
        - fill_context_for_report
        - lookup_error_code
        - get_product_specs
      data_scopes:
        - knowledge:read
        - environment:read
        - user:read
        - time:read
        - runtime:write
        - device_diagnostics:read
        - product_catalog:read
      risk_levels: [low]
    action: allow
    reason_code: standard_tool_allowed
    reason: allowed
