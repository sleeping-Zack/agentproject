services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${AGENT_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector:0.156.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      - jaeger

  app:
    build: .
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-api-key}
      AGENT_AUTH_MODE: ${AGENT_AUTH_MODE:-principal_api_key}
      AGENT_API_TENANT_ID: ${AGENT_API_TENANT_ID:-tenant-a}
      AGENT_API_USER_ID: ${AGENT_API_USER_ID:-user-1005}
      AGENT_API_USER_ROLE: ${AGENT_API_USER_ROLE:-user}
      AGENT_API_DATA_USER_ID: ${AGENT_API_DATA_USER_ID:-1005}
      AGENT_OPERATOR_API_KEY: ${AGENT_OPERATOR_API_KEY:-}
      AGENT_OPERATOR_USER_ID: ${AGENT_OPERATOR_USER_ID:-operator-local}
      AGENT_OPERATOR_TENANT_ID: ${AGENT_OPERATOR_TENANT_ID:-tenant-a}
      AGENT_ADMIN_API_KEY: ${AGENT_ADMIN_API_KEY:-}
      AGENT_ADMIN_USER_ID: ${AGENT_ADMIN_USER_ID:-admin-local}
      AGENT_ADMIN_TENANT_ID: ${AGENT_ADMIN_TENANT_ID:-tenant-a}
      AGENT_API_PRINCIPALS_JSON: ${AGENT_API_PRINCIPALS_JSON:-}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET:-}
      AGENT_JWT_ISSUER: ${AGENT_JWT_ISSUER:-}
      AGENT_JWT_AUDIENCE: ${AGENT_JWT_AUDIENCE:-}
      AGENT_ENV: production
      AGENT_STORAGE_BACKEND: postgres
      AGENT_APPROVAL_BACKEND: postgres
      AGENT_ARTIFACT_BACKEND: postgres
      AGENT_DATABASE_URL: postgresql://agent:agent@postgres:5432/agent
      AGENT_EVENT_BUS_BACKEND: redis
      AGENT_RATE_LIMIT_BACKEND: redis
      AGENT_CACHE_BACKEND: redis
      AGENT_REDIS_URL: redis://redis:6379/0
      AGENT_MEMORY_MIN_SCORE: ${AGENT_MEMORY_MIN_SCORE:-0.35}
      AGENT_MEMORY_MIN_RELEVANCE: ${AGENT_MEMORY_MIN_RELEVANCE:-0.08}
      AGENT_MEMORY_STALE_THRESHOLD: ${AGENT_MEMORY_STALE_THRESHOLD:-0.15}
      AGENT_MEMORY_MODEL_EXTRACTION_ENABLED: ${AGENT_MEMORY_MODEL_EXTRACTION_ENABLED:-true}
      AGENT_MEMORY_EXTRACTION_MAX_TOKENS: ${AGENT_MEMORY_EXTRACTION_MAX_TOKENS:-900}
      AGENT_MEMORY_EXPLICIT_CONFIDENCE: ${AGENT_MEMORY_EXPLICIT_CONFIDENCE:-0.70}
      AGENT_MEMORY_IMPLICIT_CONFIDENCE: ${AGENT_MEMORY_IMPLICIT_CONFIDENCE:-0.85}
      AGENT_MEMORY_RETENTION_ENABLED: "true"
      AGENT_MEMORY_RETENTION_INTERVAL_SECONDS: ${AGENT_MEMORY_RETENTION_INTERVAL_SECONDS:-86400}
      AGENT_MAX_RUN_TOKENS: ${AGENT_MAX_RUN_TOKENS:-32000}
      AGENT_MAX_MODEL_OUTPUT_TOKENS: ${AGENT_MAX_MODEL_OUTPUT_TOKENS:-2000}
      AGENT_MODEL_MAX_RETRIES: ${AGENT_MODEL_MAX_RETRIES:-2}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_MAX_COST: ${AGENT_MAX_COST:-1.0}
      AGENT_MAX_VERIFICATION_RETRIES: ${AGENT_MAX_VERIFICATION_RETRIES:-1}
      AGENT_MIN_REPAIR_TOKENS: ${AGENT_MIN_REPAIR_TOKENS:-4500}
      AGENT_RAG_MAX_OUTPUT_TOKENS: ${AGENT_RAG_MAX_OUTPUT_TOKENS:-1600}
      AGENT_MAX_REACT_RECURSION: ${AGENT_MAX_REACT_RECURSION:-12}
      AGENT_SUMMARY_MAX_TOKENS: ${AGENT_SUMMARY_MAX_TOKENS:-500}
      AGENT_OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: sweeper-agent
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  frontend:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0"]
    environment:
      AGENT_API_BASE_URL: http://app:8000
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-api-key}
      AGENT_UI_BEARER_TOKEN: ${AGENT_UI_BEARER_TOKEN:-}
      AGENT_UI_TENANT_ID: ${AGENT_UI_TENANT_ID:-tenant-a}
      AGENT_UI_USER_ID: ${AGENT_UI_USER_ID:-user-1005}
      AGENT_UI_USER_ROLE: ${AGENT_UI_USER_ROLE:-user}
    ports:
      - "8501:8501"
    depends_on:
      - app

volumes:
  postgres-data:
  redis-data:
